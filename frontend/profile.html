<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CyberFit — Perfil</title><link rel="stylesheet" href="css/styles.css"><script src="js/csrf.js"></script></head><body>
<div class="page-root page-profile"><div class="topbar"><div><div class="page-kicker">IDENTITY / PROFILE</div><h1 class="page-title">Mi perfil</h1><p class="page-subtitle">Personaliza tu experiencia, tus metas y tus preferencias.</p></div><a class="secondary-btn" href="security.html" style="text-decoration:none">Configurar seguridad →</a></div><div class="grid grid-2"><article class="panel"><div class="panel-title"><h2>Identidad</h2><span class="meta">cuenta actual</span></div><div class="profile-photo-wrapper" style="margin-bottom:18px"><img id="profilePhoto" class="avatar-xl" src="" alt="Foto de perfil"><div><label class="secondary-btn" for="photoInput" style="display:inline-block">Cambiar foto</label><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><p class="note" style="margin-top:7px">JPG, PNG o WebP · máximo 5 MB.</p></div></div><div id="errorMsg" class="error-msg"></div><div id="successMsg" class="success-msg"></div><form id="profileForm"><div class="form-grid"><div class="field full"><label for="name">Nombre</label><input id="name" required maxlength="80"></div><div class="field full"><label for="email">Correo electrónico</label><input id="email" disabled></div></div><div class="inline-actions"><button class="primary-btn" style="width:auto">Guardar perfil</button></div></form></article><article class="panel"><div class="panel-title"><h2>Metas de entrenamiento</h2><span class="meta">semanales</span></div><form id="goalsForm"><div class="field"><label for="weeklySessions">Sesiones objetivo</label><input id="weeklySessions" type="number" min="1" max="14"></div><div class="field"><label for="weeklyMinutes">Minutos objetivo</label><input id="weeklyMinutes" type="number" min="1" max="2000"></div><div class="field"><label for="trainingGoal">Objetivo</label><select id="trainingGoal"><option>Mejorar condición física</option><option>Fuerza</option><option>Movilidad</option><option>Resistencia</option><option>Constancia</option></select></div><div class="field"><label for="experience">Experiencia</label><select id="experience"><option>Principiante</option><option>Intermedio</option></select></div><div class="field"><label for="nutritionPreference">Preferencia alimenticia</label><input id="nutritionPreference" maxlength="120" placeholder="Sin preferencia"></div><div class="inline-actions"><button class="primary-btn" style="width:auto">Guardar metas</button></div></form></article></div></div>
<script src="js/navbar.js"></script><script>renderNavbar('profile');</script><script src="js/profile.js"></script></body></html>
